name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    # A hung job runs to GitHub's 6-hour default, so the most valuable regression this
    # suite can catch — the for_real gate flipping open — would have produced a stuck
    # runner instead of a red X. The suite now fails fast on its own (see the
    # no_real_network fixture); this is the backstop for the failure mode nobody
    # anticipated.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --timeout caps any single test rather than the whole job, so a hang names the
      # test that hung instead of just the job that did.
      - name: Test
        run: python -m pytest tests -q --timeout=120

  demo:
    name: end-to-end demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The demo builds its own repos, its own bare remotes, and its own HTTP
      # server, then runs the real publish chain against them. Running it here is
      # the check that it still works on a machine that is not the author's — which
      # is the only claim a "try it yourself" section is actually making.
      - name: Run the publish chain end to end
        env:
          NO_COLOR: "1"
        run: python demo/run_demo.py
